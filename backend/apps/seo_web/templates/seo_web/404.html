{% extends "seo_web/base.html" %}

{% block content %}
<div style="text-align: center; padding: 60px 20px; max-width: 600px; margin: 0 auto;">
    <div style="font-size: 72px; font-weight: 900; color: #94a3b8; line-height: 1; margin-bottom: 20px;">404</div>
    <h1 style="font-size: 28px; font-weight: 800; color: var(--secondary); margin-bottom: 14px;">Page Not Found</h1>
    <p style="color: var(--text-muted); font-size: 16px; margin-bottom: 30px; line-height: 1.6;">
        The requested service, professional profile, or location page could not be located. It may have been moved, updated, or temporarily unpublished.
    </p>

    <div style="display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;">
        <a href="/" style="background: var(--primary); color: #ffffff; padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 14px;">
            Return to Homepage
        </a>
        <a href="/pakistan/" style="background: #ffffff; color: var(--secondary); border: 1px solid var(--border); padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 14px;">
            Browse Pakistan Locations
        </a>
    </div>
</div>
{% endblock %}
