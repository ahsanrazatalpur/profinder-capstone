name: profinder_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # ─── Localization ────────────────────────────
  flutter_localizations:
    sdk: flutter

  # ─── HTTP / API ─────────────────────────────
  dio: ^5.4.0
  
  # ─── Local Storage ──────────────────────────
  shared_preferences: ^2.2.2
  
  # ─── State Management ───────────────────────
  provider: ^6.1.2
  
  # ─── Navigation ─────────────────────────────
  go_router: ^13.2.0
  
  # ─── UI Helpers ─────────────────────────────
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  
  # ─── Utils ──────────────────────────────────
  intl: 0.20.2
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.2
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1

  # ─── URL Launcher (Banner external links) ───
  url_launcher: ^6.2.5

  # ─── Realtime Chat (WebSocket) ──────────────
  web_socket_channel: ^2.4.0

  # ─── Chat: Emoji Picker / Voice Notes ───────
  emoji_picker_flutter: ^3.1.0
  audioplayers: ^6.1.0
  record: ^5.1.2
  http: ^1.6.0

  # ─── GPS / Location ─────────────────────────

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ─── App Icon Generator ──────────────────────
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21